version: 2.1
orbs:
  android: circleci/android@3.2.0

jobs:
  build_and_test:
    executor:
      name: android/android_machine
      resource_class: large
      tag: default
    steps:
      - checkout
      
      # Gradleの依存関係をキャッシュから復元（ビルド時間短縮） 
      - android/restore_gradle_cache:
          cache_prefix: v1
            
      # 権限付与
      - run:
          name: Grant execute permission
          command: |
            chmod +x gradlew
            ls -l gradlew
            
      # Dependencies
      # - run:
          # name: Download Dependencies
          #  command: ./gradlew androidDependencies
          # command: ./gradlew gradlew androidDependencies
          
      # 単体テストの実行
      - run:
          name: Run Tests
          command: ./gradlew app/src/test/java/com/example/sample_test/calcTest.java

      # キャッシュの保存
      - android/save_gradle_cache:
          cache_prefix: v1

      # テスト結果をCircleCI上に保存
      - store_test_results:
          path: app/build/test-results
      
      # APKやApp Bundleなどの成果物を保存
      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk

workflows:
  build_workflow:
    jobs:
      - build_and_test
